<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MOYAOJI ARCHIVE</title>
<!-- prototype v0.6 / ARCHIVE hierarchy + SIGNAL/OBSERVATION/AFTERGLOW entry scenes -->
<style>
:root{
  --fg:#e8e8e4; --muted:#9b9b96; --glass:rgba(12,13,14,.88);
  --line:rgba(240,240,236,.16); --paper:#ecebe4; --ink:#161716;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0c0d;color:var(--fg);font-family:"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;overflow:hidden}
button{font:inherit}
#app{position:fixed;inset:0;background:#0b0c0d}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .28s ease;background:#0b0c0d}
.scene.active{opacity:1;pointer-events:auto}
.scene-bg{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;background-size:cover;filter:saturate(.96)}
.scene-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.11));pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;color:transparent;outline:none;padding:0}
.hotspot::after{content:"";position:absolute;inset:0;border:1px solid transparent;transition:background .18s ease,border-color .18s ease,box-shadow .18s ease}
.hotspot:hover::after,.hotspot:focus-visible::after{background:rgba(255,255,255,.018);border-color:rgba(255,255,255,.025)}
.hotspot.entrance{left:66.1%;top:34%;width:13.1%;height:48%}
.hotspot.signal-entry{left:62.2%;top:35%;width:16%;height:21%}

/* ARCHIVE navigation scenes: keep every approved 16:9 image fully visible.
   Hotspots are positioned inside the fitted image, so desktop/mobile share
   the same image-coordinate percentages without crop drift. */
.static-scene{background:#0b0c0d}
.scene-frame{
  position:absolute;
  left:50%;
  top:50%;
  width:100vw;
  height:56.25vw;
  max-width:177.7778vh;
  max-height:100vh;
  transform:translate(-50%,-50%);
  overflow:hidden;
  background:#0b0c0d;
}
.scene-image{
  display:block;
  width:100%;
  height:100%;
  object-fit:fill;
  user-select:none;
  -webkit-user-drag:none;
}
.frame-hotspot{
  position:absolute;
  z-index:4;
  border:0;
  background:transparent;
  cursor:pointer;
  padding:0;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
.frame-hotspot::after{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid transparent;
  transition:background .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.frame-hotspot:hover::after,
.frame-hotspot:focus-visible::after{
  background:rgba(255,255,255,.025);
  border-color:rgba(255,255,255,.055);
  box-shadow:0 0 24px rgba(255,255,255,.025);
}

/* Approved entrance: basement door on the right. */
.entrance-door{left:66.0%;top:51.5%;width:12.7%;height:31.5%}

/* ARCHIVE corridor — three category doors. */
.hall-observation{left:4.8%;top:25.0%;width:9.0%;height:58.0%}
.hall-signal{left:46.7%;top:39.0%;width:7.4%;height:22.5%}
.hall-afterglow{left:79.8%;top:25.0%;width:8.4%;height:58.0%}

/* SIGNAL room — central SIGNAL 01 / SHIJiMA display. */
.signal-shijima{left:38.5%;top:31.5%;width:18.5%;height:25.5%}

/* SHIJiMA room — first lower drawer carrying まだ、ここにいる. */
.shijima-mada{left:23.4%;top:67.0%;width:14.7%;height:20.0%}


/* SIGNAL 02 / WHITE NOISE CLUB — right wall display in the shared SIGNAL room. */
.signal-wnc{left:67.0%;top:35.3%;width:14.8%;height:20.4%}
.signal-wnc-label{
  position:absolute;z-index:3;left:67.0%;top:39.2%;width:14.8%;
  color:#e9e8e2;text-align:center;pointer-events:none;text-transform:uppercase;
  text-shadow:0 1px 12px rgba(0,0,0,.45)
}
.signal-wnc-label .signal-no{display:block;font-size:clamp(4px,.68vw,11px);letter-spacing:.20em;margin-bottom:.9em;white-space:nowrap}
.signal-wnc-label .signal-name{display:block;font-size:clamp(4px,.83vw,14px);letter-spacing:.10em;line-height:1.2;white-space:nowrap}

/* WNC first layer — one active record on the right shelf. */
.wnc-record{left:72.0%;top:52.0%;width:9.0%;height:12.0%;min-width:48px;min-height:40px}
.wnc-record-hint{
  position:absolute;z-index:6;left:68.2%;top:66.1%;width:17.0%;
  padding:7px 9px;background:rgba(8,9,10,.82);border:1px solid rgba(255,255,255,.10);
  color:#e8e7e1;font-size:clamp(7px,.62vw,10px);letter-spacing:.12em;line-height:1.5;
  text-align:center;opacity:0;transform:translateY(4px);transition:opacity .16s ease,transform .16s ease;
  pointer-events:none;text-transform:uppercase
}
.wnc-record:hover + .wnc-record-hint,.wnc-record:focus-visible + .wnc-record-hint,.wnc-record-hint.show{opacity:1;transform:translateY(0)}

/* WNC album room — right board selects, left wall displays. */
.wnc-viewer{
  position:absolute;z-index:5;left:8.6%;top:27.0%;width:36.8%;height:38.0%;
  padding:18px 22px;background:rgba(239,229,208,.93);border:1px solid rgba(35,28,22,.12);
  box-shadow:0 12px 34px rgba(42,29,18,.14);color:#28231f;opacity:0;pointer-events:none;
  transform:translateY(3px);transition:opacity .16s ease,transform .16s ease;overflow:hidden
}
.wnc-viewer.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
.wnc-viewer.linkable{cursor:pointer}
.wnc-viewer.linkable:hover{box-shadow:0 13px 38px rgba(42,29,18,.20)}
.wnc-viewer-inner{height:100%;display:flex;flex-direction:column;justify-content:center;min-width:0}
.wnc-kicker{font-size:clamp(7px,.58vw,9px);letter-spacing:.22em;text-transform:uppercase;opacity:.58;margin-bottom:10px}
.wnc-title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(15px,1.55vw,26px);letter-spacing:.07em;line-height:1.24;margin-bottom:14px}
.wnc-copy{font-size:clamp(8px,.72vw,12px);line-height:1.75;letter-spacing:.035em;max-width:95%}
.wnc-pending{margin-top:16px;font-size:clamp(7px,.62vw,10px);letter-spacing:.16em;text-transform:uppercase;opacity:.56}
.wnc-open{margin-top:16px;font-size:clamp(7px,.62vw,10px);letter-spacing:.16em;text-transform:uppercase}
.wnc-media{display:flex;align-items:center;gap:20px;height:100%;min-height:0}
.wnc-media img{display:block;max-width:48%;max-height:92%;object-fit:contain;box-shadow:0 9px 28px rgba(0,0,0,.17)}
.wnc-media .wnc-copy{flex:1}
.wnc-members-photo{max-width:58%!important;box-shadow:0 10px 28px rgba(0,0,0,.15)!important}

.wnc-desktop-hit{position:absolute;z-index:7;border:0;background:transparent;padding:0;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.wnc-desktop-hit::after{content:"";position:absolute;inset:0;border:1px solid transparent;transition:.14s ease}
.wnc-desktop-hit:hover::after,.wnc-desktop-hit:focus-visible::after{border-color:rgba(255,234,195,.13);background:rgba(255,235,205,.02)}
.wnc-hit-cover{left:50.3%;top:24.3%;width:19.2%;height:40.0%}
.wnc-hit-album{left:70.2%;top:23.5%;width:14.4%;height:9.0%}
/* Track hit areas calibrated row-by-row to the printed track list.
   Keep them narrow and non-overlapping so later rows cannot steal taps. */
.wnc-hit-t1{left:70.2%;top:33.6%;width:14.4%;height:2.2%}
.wnc-hit-t2{left:70.2%;top:35.8%;width:14.4%;height:2.2%}
.wnc-hit-t3{left:70.2%;top:38.0%;width:14.4%;height:2.1%}
.wnc-hit-t4{left:70.2%;top:40.1%;width:14.4%;height:2.1%}
.wnc-hit-t5{left:70.2%;top:42.2%;width:14.4%;height:2.1%}
.wnc-hit-t6{left:70.2%;top:44.3%;width:14.4%;height:2.1%}
.wnc-hit-t7{left:70.2%;top:46.4%;width:14.4%;height:2.1%}
.wnc-hit-members{left:70.2%;top:51.2%;width:14.4%;height:14.0%}
.wnc-hit-youtube{left:70.2%;top:66.3%;width:14.4%;height:4.3%}

.wnc-mobile-controls{display:none}

.corner-ui{position:fixed;z-index:100;left:18px;bottom:16px;display:flex;gap:8px;align-items:center}
.sound-toggle,.back-link{border:0;background:rgba(7,8,9,.58);backdrop-filter:blur(6px);color:#bfc0bc;padding:8px 10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.sound-toggle:hover,.back-link:hover{color:#fff}
.status{position:fixed;z-index:100;right:18px;bottom:18px;color:#9ea09b;font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
.signal-label{position:absolute;right:24.2%;top:36.4%;font-size:10px;letter-spacing:.18em;color:rgba(25,25,25,.0);pointer-events:none}

/* SHIJiMA room interactive overlay */
#shijima .scene-bg{background-size:cover}
#paperHotspots{position:absolute;left:26.256%;top:19.447%;width:28.349%;height:41.764%}
.paper-hit{position:absolute;left:0;width:60%;border:0;background:transparent;cursor:pointer}
.paper-hit::after{content:"";position:absolute;inset:-2px -5px;border-left:1px solid transparent;transition:.18s ease}
.paper-hit:hover::after,.paper-hit:focus-visible::after{border-left-color:rgba(15,15,15,.22);background:rgba(0,0,0,.018)}
.paper-hit[data-kind="profile"]{top:0;height:13%}
.paper-hit[data-kind="album"]{top:14%;height:20%}
/* Desktop hit areas are calibrated to the printed rows in the source image. */
.paper-hit.track[data-track="01"]{top:37.405%;height:4.835%}
.paper-hit.track[data-track="02"]{top:42.239%;height:4.580%}
.paper-hit.track[data-track="03"]{top:46.819%;height:4.580%}
.paper-hit.track[data-track="04"]{top:51.399%;height:4.580%}
.paper-hit.track[data-track="05"]{top:55.980%;height:4.580%}
.paper-hit.track[data-track="06"]{top:60.560%;height:4.835%}
.paper-hit.material[data-material="audio"]{top:74.555%;height:3.817%}
.paper-hit.material[data-material="lyrics"]{top:78.372%;height:3.562%}
.paper-hit.material[data-material="visual"]{top:81.934%;height:3.562%}
.paper-hit.material[data-material="moving"]{top:85.496%;height:3.308%}
.paper-hit.material[data-material="listening"]{top:88.804%;height:3.562%}
.paper-hit.material[data-material="related"]{top:92.366%;height:3.562%}

/* Fallback coordinates match the actual inner glass in the source image.
   JS below keeps these coordinates locked to the cover-cropped background. */
.viewer{position:absolute;left:58.672%;top:21.041%;width:25.957%;height:36.344%;overflow:hidden;background:rgba(8,9,10,.72);border:1px solid rgba(227,224,216,.14);box-shadow:inset 0 0 45px rgba(0,0,0,.55);color:#e6e5df;backdrop-filter:blur(1.6px);transition:opacity .16s ease,filter .16s ease}
.viewer.hidden-ish{opacity:.58;filter:contrast(.92) brightness(.78)}
.viewer::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.07),transparent 25%,transparent 72%,rgba(255,255,255,.03));pointer-events:none;mix-blend-mode:screen}
.viewer-inner{position:absolute;inset:0;padding:28px 30px;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.viewer-kicker{font-size:9px;letter-spacing:.22em;color:#a9aaa5;text-transform:uppercase;margin-bottom:12px}
.viewer-title{font-size:20px;font-weight:400;letter-spacing:.08em;margin:0 0 18px}
.viewer-small{font-size:10px;line-height:1.75;letter-spacing:.08em;color:#b9bbb5}
.viewer-rule{height:1px;background:rgba(255,255,255,.12);margin:17px 0}
.cover-wrap{height:100%;display:grid;place-items:center;padding:24px}
.cover-wrap img{width:min(72%,270px);aspect-ratio:1;object-fit:cover;box-shadow:0 16px 48px rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.08)}
.cover-meta{position:absolute;right:22px;bottom:21px;text-align:right;font-size:9px;letter-spacing:.16em;color:#d7d8d2}
.link-row,.material-row,.track-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.09);cursor:pointer}
.link-row:last-child,.material-row:last-child,.track-row:last-child{border-bottom:0}
.link-row:hover,.material-row:hover,.track-row:hover{color:#fff}
.dim{opacity:.28;cursor:default}
.active-mark{font-size:8px;letter-spacing:.18em;color:#aeb0aa}
.viewer-button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);color:#d9dad5;padding:8px 10px;margin-top:13px;font-size:9px;letter-spacing:.18em;cursor:pointer}
.viewer-button:hover{background:rgba(255,255,255,.07)}
.lyrics{white-space:pre-wrap;font-size:12px;line-height:2;letter-spacing:.05em;color:#e2e2de;padding-bottom:38px}
.profile{font-size:12px;line-height:2;letter-spacing:.04em;color:#dedfd9;max-width:none;min-width:0}
.profile strong{font-weight:500;letter-spacing:.08em}
/* PUBLIC RECORD desktop layout: reserve a real column for PORTRAIT 01.
   It still sits at the lower-right visually, but can never cover the copy. */
.profile-wrap{position:relative;min-height:100%;padding-bottom:0;display:grid;grid-template-columns:minmax(0,1fr) 82px;column-gap:16px;align-items:end}
.profile{grid-column:1;align-self:start}
.portrait-thumb{position:static;grid-column:2;align-self:end;justify-self:end;width:76px;margin:0;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.025);padding:4px;cursor:pointer}
.portrait-thumb img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;filter:saturate(.88) contrast(.96)}
.portrait-caption{margin-top:5px;font-size:7px;line-height:1.45;letter-spacing:.14em;color:#a6a8a3;text-transform:uppercase}
.image-record{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.image-record img{display:block;max-width:78%;max-height:78%;object-fit:contain;border:1px solid rgba(255,255,255,.09);box-shadow:0 16px 50px rgba(0,0,0,.34)}
.image-record.square img{aspect-ratio:1;object-fit:cover;width:min(76%,300px);height:auto}
.image-record.portrait img{max-width:82%;max-height:74%;object-fit:contain}
.image-record-meta{position:absolute;left:24px;bottom:20px;font-size:8px;line-height:1.65;letter-spacing:.15em;color:#c7c8c2;text-transform:uppercase}
.image-record-action{position:absolute;right:20px;bottom:18px;border:0;background:transparent;color:#aeb0aa;padding:4px 0;font-size:8px;letter-spacing:.15em;cursor:pointer;text-transform:uppercase}
.image-record-action:hover{color:#fff}
.external-note{font-size:9px;line-height:1.8;letter-spacing:.12em;color:#969894;margin-top:12px}

/* subtle hover title hint */
.touch-hint{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:26px;font-size:9px;letter-spacing:.16em;color:rgba(255,255,255,.62);background:rgba(5,6,7,.45);padding:7px 9px}
@media (max-width: 850px){
  .scene-bg{background-size:auto 100%;background-position:center}
  #paperHotspots{left:26.256%;top:19.447%;width:28.349%;height:41.764%}
  .viewer{left:58.672%;top:21.041%;width:25.957%;height:36.344%}
  .viewer-inner{padding:17px 18px}
  .viewer-title{font-size:15px}
  .touch-hint{display:block}
}
@media (orientation:portrait) and (max-width:850px){
  .scene-bg{background-size:auto 100%;background-position:center}
  .status{top:12px;bottom:auto}
}


/* ============================================================
   PORTRAIT MOBILE LAYOUT
   Preserve the full room image, then stack the paper index and
   viewing window below it. Desktop layout remains unchanged.
   ============================================================ */
@media (orientation:portrait) and (max-width:850px){
  html,body{overflow:hidden;background:#0b0c0d}

  /* ENTRANCE / SIGNAL: show the entire 16:9-ish scene rather than
     cropping away the right side. Hotspots follow the fitted image. */
  #entrance .scene-bg{
    inset:auto 0 auto 0;
    top:calc(50dvh - 28.03vw);
    width:100vw;
    height:56.06vw;
    background-size:100% 100%;
    background-position:center;
  }
  #signal .scene-bg{
    inset:auto 0 auto 0;
    top:calc(50dvh - 28.14vw);
    width:100vw;
    height:56.28vw;
    background-size:100% 100%;
    background-position:center;
  }
  .hotspot.entrance{
    left:66.1vw;
    top:calc(50dvh - 8.97vw);
    width:13.1vw;
    height:26.91vw;
    min-width:48px;
  }
  .hotspot.signal-entry{
    left:62.2vw;
    top:calc(50dvh - 8.44vw);
    width:16vw;
    height:11.82vw;
    min-width:54px;
    min-height:44px;
  }
  #signal .touch-hint{display:none}

  /* SHIJiMA: full room first, then a readable/tappable close-up of
     the paper index and the viewing window. */
  #shijima{
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding-bottom:88px;
    background:#0b0c0d;
  }
  #shijima .scene-bg{
    position:relative;
    inset:auto;
    width:100vw;
    height:56.28vw;
    background-size:100% 100%;
    background-position:center;
    flex:none;
  }

  #paperHotspots{
    position:relative;
    left:auto;
    top:auto;
    width:calc(100% - 28px);
    height:auto;
    margin:14px 14px 10px;
    padding:15px 17px 17px;
    background:rgba(236,235,228,.97);
    border:1px solid rgba(20,20,18,.15);
    box-shadow:0 10px 32px rgba(0,0,0,.18);
  }
  #paperHotspots::before{
    content:"SHIJiMA  /  SIGNAL 01";
    display:block;
    margin-bottom:10px;
    padding-bottom:9px;
    border-bottom:1px solid rgba(20,20,18,.16);
    color:#191a18;
    font-size:10px;
    letter-spacing:.20em;
  }
  .paper-hit,
  .paper-hit[data-kind="profile"],
  .paper-hit[data-kind="album"],
  .paper-hit.track,
  .paper-hit.material{
    position:relative;
    left:auto;
    top:auto !important;
    width:100%;
    height:auto !important;
    min-height:38px;
    display:block;
    padding:10px 4px 9px;
    border:0;
    border-bottom:1px solid rgba(20,20,18,.08);
    color:#171816;
    text-align:left;
    background:transparent;
  }
  .paper-hit::before{
    content:attr(aria-label);
    position:relative;
    z-index:2;
    display:block;
    color:#171816;
    font-size:11px;
    line-height:1.3;
    letter-spacing:.10em;
    white-space:normal;
  }
  .paper-hit::after{
    inset:3px -4px;
    border:0;
    border-left:1px solid transparent;
  }
  .paper-hit:active::after,
  .paper-hit:focus-visible::after{
    background:rgba(20,20,18,.045);
    border-left-color:rgba(20,20,18,.35);
  }
  .paper-hit[data-kind="album"]::before{font-size:14px;letter-spacing:.08em}
  .paper-hit.material[data-material="audio"]{
    margin-top:10px;
    border-top:1px solid rgba(20,20,18,.16);
    padding-top:15px;
  }

  .viewer{
    position:relative;
    left:auto;
    top:auto;
    width:calc(100% - 28px);
    height:56dvh;
    min-height:420px;
    max-height:620px;
    margin:0 14px;
    background:rgba(8,9,10,.94);
    border-color:rgba(227,224,216,.18);
    box-shadow:inset 0 0 45px rgba(0,0,0,.55),0 14px 36px rgba(0,0,0,.20);
  }
  .viewer-inner{padding:24px 22px 28px}
  .viewer-title{font-size:19px}
  .viewer-small{font-size:11px;line-height:1.75}
  .link-row,.material-row,.track-row{min-height:44px;padding:11px 0}
  .cover-wrap{padding:22px}
  .cover-wrap img{width:min(76%,300px)}
  .image-record{padding:22px}
  .image-record img{max-width:90%;max-height:78%}
  .image-record.square img{width:min(78%,320px)}
  /* PUBLIC RECORD: keep the portrait in normal document flow on phones.
     Desktop keeps the small bottom-right floating portrait. */
  .profile-wrap{
    position:relative;
    min-height:0;
    padding-bottom:0;
    display:block;
  }
  .profile{
    max-width:none;
    width:100%;
  }
  .portrait-thumb{
    position:static;
    right:auto;
    bottom:auto;
    display:block;
    width:min(46%,150px);
    margin:24px 0 0 auto;
  }

  /* Mobile-only chrome: don't let fixed UI sit on top of archive content. */
  .corner-ui{
    position:relative;
    left:auto;
    bottom:auto;
    margin:14px 14px max(12px,env(safe-area-inset-bottom));
    gap:5px;
    width:calc(100% - 28px);
  }
  .sound-toggle,.back-link{padding:8px 9px;font-size:9px}
  .status{display:none}
}


@media (orientation:portrait) and (max-width:850px){
  /* Keep the SIGNAL 02 label proportional to the scaled gallery image on phones. */
  .signal-wnc-label .signal-no{font-size:3.6px;letter-spacing:.14em}
  .signal-wnc-label .signal-name{font-size:4px;letter-spacing:.07em;line-height:1;white-space:nowrap}
}

@media (orientation:portrait) and (max-width:850px){
  body:not(.detail-route) .corner-ui{
    position:fixed;
    left:14px;
    bottom:max(12px,env(safe-area-inset-bottom));
    margin:0;
    width:auto;
    z-index:100;
  }

function route(){
  const h = location.hash || '#/entrance';
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));

  const isShijimaDetail = h.startsWith('#/signal/shijima/mada-koko-ni-iru');
  const isWncDetail = h.startsWith('#/signal/wnc/the-space-between-signals');
  const isDetail = isShijimaDetail || isWncDetail;
  document.body.classList.toggle('detail-route', isDetail);

  let target = 'entrance';
  if(isShijimaDetail) target = 'shijima';
  else if(isWncDetail) target = 'wnc-album';
  else if(h === '#/signal/shijima') target = 'shijima-index';
  else if(h === '#/signal/wnc') target = 'wnc-index';
  else if(h.startsWith('#/signal')) target = 'signal';
  else if(h.startsWith('#/observation')) target = 'observation';
  else if(h.startsWith('#/afterglow')) target = 'afterglow';
  else if(h.startsWith('#/hall')) target = 'hall';

  document.getElementById(target)?.classList.add('active');
  syncEntranceMusic(target);

  if(isShijimaDetail) statusEl.textContent = 'SIGNAL 01 / SHIJiMA / まだ、ここにいる';
  else if(isWncDetail) statusEl.textContent = 'SIGNAL 02 / WHITE NOISE CLUB / THE SPACE BETWEEN SIGNALS';
  else if(target === 'shijima-index') statusEl.textContent = 'SIGNAL 01 / SHIJiMA';
  else if(target === 'wnc-index') statusEl.textContent = 'SIGNAL 02 / WHITE NOISE CLUB';
  else if(target === 'signal') statusEl.textContent = 'SIGNAL';
  else if(target === 'observation') statusEl.textContent = 'OBSERVATION LOG';
  else if(target === 'afterglow') statusEl.textContent = 'AFTERGLOW CITY';
  else statusEl.textContent = 'ARCHIVE ACTIVE';

  if(isShijimaDetail) renderFromRoute(h);
  if(isWncDetail) resetWncViewer();
}

function renderFromRoute(h){
  const parts = h.split('/');
  if(h.includes('/lyrics/')) return showLyrics(parts.at(-1));
  if(h.includes('/track/')) return showTrack(parts.at(-1), true);
  if(h.includes('/material/')) return showMaterial(parts.at(-1), true);
  if(h.endsWith('/record')) return showAlbum(true);
  showDefault();
}

function setViewer(html, dim=false){
  viewer.classList.toggle('hidden-ish', dim);
  viewerInner.innerHTML = html;
  bindViewerActions();
}

function showDefault(){
  locked = null;
  setViewer(`<div class="viewer-kicker">VIEWING WINDOW</div><div class="viewer-title">SIGNAL 01</div><div class="viewer-small">Move across the paper record.<br>Information appears here.</div>`, true);
}

function showProfile(lock=false){
  if(lock) locked={type:'profile'};
  setViewer(`<div class="viewer-kicker">PUBLIC RECORD</div>
    <div class="viewer-title">SHIJiMA</div>
    <div class="profile-wrap"><div class="profile"><strong>清水テラ — Vocal</strong><br><strong>紫陽林 治 — Composition</strong><br><br>
    静けさを基準に、危うさと未解決の余白を残すオルタナティブ・ユニット。<br><br>
    バーガー店で働いていたテラと、その隣の花屋にいた治。花を介した小さなやり取りをきっかけに言葉を交わすようになり、やがて二人で音を作り始めた。<br><br>
    派手な活動をすることなく、少しずつ作品を残している。</div>
    <button class="portrait-thumb" type="button" data-view-portrait aria-label="SHIJiMA portrait record"><img src="./shijima-portrait.jpg" alt="SHIJiMA portrait"><div class="portrait-caption">PORTRAIT 01<br>OPEN RECORD</div></button></div>`);
}
function showAlbum(lock=false){
  if(lock) locked={type:'album'};
  viewer.classList.remove('hidden-ish');
  viewerInner.innerHTML = `<div class="cover-wrap"><img src="./album-cover.png" alt="まだ、ここにいる album cover"><div class="cover-meta">RECORD<br>まだ、ここにいる</div></div>`;
}

function showTrack(id, lock=false){
  const t=TRACKS[id]; if(!t) return;
  if(lock) locked={type:'track',id};
  const rows=t.materials.map(m=>`<div class="material-row" data-open-material="${m}" data-track="${id}"><span>${MATERIAL_LABEL[m]}</span><span class="active-mark">ACTIVE</span></div>`).join('');
  setViewer(`<div class="viewer-kicker">TRACK ${id}</div><div class="viewer-title">${t.title}</div><div class="viewer-small">AVAILABLE MATERIAL</div><div class="viewer-rule"></div>${rows}`);
}

function showMaterial(m, lock=false){
  if(lock) locked={type:'material',m};
  const rows=Object.entries(TRACKS).map(([id,t])=>{
    const active=t.materials.includes(m);
    return `<div class="track-row ${active?'':'dim'}" ${active?`data-open-track="${id}" data-material="${m}"`:''}><span>${id}&nbsp;&nbsp;${t.title}</span><span class="active-mark">${active?'ACTIVE':'—'}</span></div>`;
  }).join('');
  setViewer(`<div class="viewer-kicker">MATERIAL INDEX</div><div class="viewer-title">${MATERIAL_LABEL[m]||m}</div><div class="viewer-small">AVAILABLE RECORDS</div><div class="viewer-rule"></div>${rows}`);
}

function showLyrics(id){
  const t=TRACKS[id]; if(!t) return;
  locked={type:'lyrics',id};
  setViewer(`<div class="viewer-kicker">LYRICS / TRACK ${id}</div><div class="viewer-title">${t.title}</div><div class="lyrics">${escapeHtml(LYRICS[id]||'')}</div>`);
}

function openMaterial(id,m){
  const t=TRACKS[id]; if(!t || !t.materials.includes(m)) return;
  playClick();
  if(m==='lyrics') { location.hash=`#/signal/shijima/mada-koko-ni-iru/lyrics/${id}`; return; }
  if(m==='audio' || m==='listening') {
    const url=EXTERNAL.listeningLog[id];
    if(url) window.open(url,'_blank','noopener');
    else showExternalPending(id, m, 'MOYA LISTENING LOG');
    return;
  }
  if(m==='moving') {
    if(id==='04' && EXTERNAL.wavePV) window.open(EXTERNAL.wavePV,'_blank','noopener');
    else showExternalPending(id,m,'MOVING IMAGE');
    return;
  }
  if(m==='related') {
    if(id==='04' && EXTERNAL.sumimaCM) window.open(EXTERNAL.sumimaCM,'_blank','noopener');
    else showExternalPending(id,m,'RELATED MATERIAL');
    return;
  }
  if(m==='visual') {
    showVisual(id);
    return;
  }
}

function showVisual(id){
  const t=TRACKS[id]; if(!t) return;
  const src = id==='03' ? './track-03-suna.jpg' : id==='04' ? './track-04-nami.jpg' : null;
  if(!src){
    setViewer(`<div class="viewer-kicker">VISUAL MATERIAL / TRACK ${id}</div><div class="viewer-title">${t.title}</div><div class="viewer-small">NO PUBLIC VISUAL RECORD.</div>`);
    return;
  }
  setViewer(`<div class="image-record square"><img src="${src}" alt="${t.title} jacket"><div class="image-record-meta">VISUAL MATERIAL<br>TRACK ${id} / ${t.title}<br>JACKET RECORD</div></div>`);
}

function showPortrait(){
  setViewer(`<div class="image-record portrait"><img src="./shijima-portrait.jpg" alt="SHIJiMA portrait"><div class="image-record-meta">PUBLIC RECORD<br>SHIJiMA / PORTRAIT 01</div><button class="image-record-action" type="button" data-return-profile>RETURN</button></div>`);
}

function showExternalPending(id,m,source){
  const t=TRACKS[id];
  setViewer(`<div class="viewer-kicker">EXTERNAL SIGNAL</div><div class="viewer-title">${id}&nbsp;&nbsp;${t.title}</div><div class="viewer-small">SOURCE : ${source}<br>CONNECTION POINT NOT ASSIGNED IN THIS PROTOTYPE.</div><div class="external-note">Paste the final YouTube URL / timestamp into the EXTERNAL config in index.html before release.</div>`);
}

function bindViewerActions(){
  document.querySelectorAll('[data-open-material]').forEach(el=>el.addEventListener('click',()=>openMaterial(el.dataset.track,el.dataset.openMaterial)));
  document.querySelectorAll('[data-open-track]').forEach(el=>el.addEventListener('click',()=>openMaterial(el.dataset.openTrack,el.dataset.material)));
  document.querySelectorAll('[data-view-portrait]').forEach(el=>el.addEventListener('click',()=>{playClick();showPortrait();}));
  document.querySelectorAll('[data-return-profile]').forEach(el=>el.addEventListener('click',()=>{playClick();showProfile(true);}));
}

function escapeHtml(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function previewHit(el){
  playHover();
  const kind=el.dataset.kind;
  if(kind==='profile') showProfile(false);
  if(kind==='album') showAlbum(false);
  if(kind==='track') showTrack(el.dataset.track,false);
  if(kind==='material') showMaterial(el.dataset.material,false);
}
function restoreLocked(){
  if(!locked) return showDefault();
  if(locked.type==='profile') showProfile(true);
  if(locked.type==='album') showAlbum(true);
  if(locked.type==='track') showTrack(locked.id,true);
  if(locked.type==='material') showMaterial(locked.m,true);
  if(locked.type==='lyrics') showLyrics(locked.id);
}

function activateHit(el){
  const key=el.dataset.kind+':' +(el.dataset.track||el.dataset.material||'');
  const isTouch=matchMedia('(pointer: coarse)').matches;
  if(isTouch && touchArmed!==key){ touchArmed=key; previewHit(el); setTimeout(()=>{if(touchArmed===key)touchArmed=null},1800); return; }
  touchArmed=null; playClick();
  const kind=el.dataset.kind;
  if(kind==='profile'){ locked={type:'profile'}; showProfile(true); }
  if(kind==='album'){ locked={type:'album'}; location.hash='#/signal/shijima/mada-koko-ni-iru/record'; }
  if(kind==='track'){ locked={type:'track',id:el.dataset.track}; location.hash=`#/signal/shijima/mada-koko-ni-iru/track/${el.dataset.track}`; }
  if(kind==='material'){ locked={type:'material',m:el.dataset.material}; location.hash=`#/signal/shijima/mada-koko-ni-iru/material/${el.dataset.material}`; }
}

document.querySelectorAll('.paper-hit').forEach(el=>{
  el.addEventListener('mouseenter',()=>{ if(!matchMedia('(pointer: coarse)').matches) previewHit(el); });
  el.addEventListener('mouseleave',()=>{ if(!matchMedia('(pointer: coarse)').matches) restoreLocked(); });
  el.addEventListener('click',()=>activateHit(el));
});


/* ---------- WHITE NOISE CLUB / SIGNAL 02 ---------- */
function wncHtml(action, trackId){
  if(action==='cover'){
    return `<div class="wnc-media"><img src="./wnc-album-cover.jpg" alt="THE SPACE BETWEEN SIGNALS album cover"><div class="wnc-copy"><div class="wnc-kicker">ALBUM COVER</div><div class="wnc-title">THE SPACE BETWEEN SIGNALS</div><div>WHITE NOISE CLUB<br>7-track Mini Album</div></div></div>`;
  }
  if(action==='notes'){
    return `<div class="wnc-kicker">ALBUM RECORD</div><div class="wnc-title">THE SPACE BETWEEN SIGNALS</div><div class="wnc-copy">WHITE NOISE CLUBのファースト・ミニアルバム。全7曲。<br><br>バー「menorah」の奥にサム・ポークが長期間籠もり、そこで曲を書き溜めていたという噂がある。物置には『THE SPACE BETWEEN SIGNALS』と記されたメモが残されていた。</div>`;
  }
  if(action==='members'){
    return `<div class="wnc-media"><img class="wnc-members-photo" src="./wnc-portrait.jpg" alt="WHITE NOISE CLUB artist portrait"><div class="wnc-copy"><div class="wnc-kicker">PUBLIC RECORD / MEMBERS</div><div class="wnc-title">WHITE NOISE CLUB</div>Sam Pork — Vocal<br>Sinéad O’Meara — Guitar<br>Ichisam Boone — Bass<br>Nisam Boone — Keyboards<br>Golda Writer — Drums<br><br><strong>The Sixth Member: Rebecca Levi</strong><br>バー「menorah」の経営者。演奏メンバーではない。</div></div>`;
  }
  if(action==='youtube'){
    return `<div class="wnc-kicker">EXTERNAL SIGNAL</div><div class="wnc-title">YouTube</div><div class="wnc-copy">音楽の再生先はYouTubeです。</div><div class="wnc-pending">YouTube公開準備中</div>`;
  }
  if(action==='track'){
    const title=WNC_TRACKS[trackId]||'';
    const url=WNC_EXTERNAL.tracks[trackId]||'';
    return `<div class="wnc-kicker">TRACK ${trackId}</div><div class="wnc-title">${title}</div><div class="wnc-copy">THE SPACE BETWEEN SIGNALS</div>${url?'<div class="wnc-open">OPEN EXTERNAL SIGNAL</div>':'<div class="wnc-pending">YouTube公開準備中</div>'}`;
  }
  return '';
}

function wncUrl(action, trackId){
  if(action==='track') return WNC_EXTERNAL.tracks[trackId]||'';
  if(action==='youtube') return WNC_EXTERNAL.album||'';
  return '';
}

function renderWnc(action, trackId='', lock=false){
  if(lock) wncLocked={action,trackId};
  const html=wncHtml(action,trackId);
  const url=wncUrl(action,trackId);
  wncCurrentUrl=url;
  if(wncViewer && wncViewerInner){
    wncViewerInner.innerHTML=html;
    wncViewer.classList.add('visible');
    wncViewer.classList.toggle('linkable',!!url);
    wncViewer.setAttribute('aria-label',url?'Open external signal':'WHITE NOISE CLUB record display');
  }
  if(wncMobileViewerInner) wncMobileViewerInner.innerHTML=html;
  if(wncMobileOpen){
    wncMobileOpen.classList.toggle('show',!!url);
    wncMobileOpen.dataset.url=url;
  }
}

function resetWncViewer(){
  wncLocked=null; wncCurrentUrl='';
  if(wncViewer){wncViewer.classList.remove('visible','linkable');wncViewer.removeAttribute('data-url');}
  if(wncMobileViewerInner) wncMobileViewerInner.innerHTML='<div class="wnc-kicker">SIGNAL 02</div><div class="wnc-title">Select a record.</div>';
  if(wncMobileOpen){wncMobileOpen.classList.remove('show');wncMobileOpen.dataset.url='';}
}

function restoreWncLocked(){
  if(wncLocked) renderWnc(wncLocked.action,wncLocked.trackId,true);
  else if(wncViewer){wncViewer.classList.remove('visible','linkable');wncCurrentUrl='';}
}

function openWncCurrent(){ if(wncCurrentUrl) window.open(wncCurrentUrl,'_blank','noopener'); }
wncViewer?.addEventListener('click',openWncCurrent);
wncViewer?.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&wncCurrentUrl){e.preventDefault();openWncCurrent();}});
wncMobileOpen?.addEventListener('click',()=>{const u=wncMobileOpen.dataset.url;if(u)window.open(u,'_blank','noopener');});

document.querySelectorAll('.wnc-desktop-hit').forEach(el=>{
  el.addEventListener('mouseenter',()=>{if(!matchMedia('(pointer: coarse)').matches){playHover();renderWnc(el.dataset.wncAction,el.dataset.wncTrack||'',false);}});
  el.addEventListener('mouseleave',()=>{if(!matchMedia('(pointer: coarse)').matches)restoreWncLocked();});
  el.addEventListener('click',()=>{playClick();renderWnc(el.dataset.wncAction,el.dataset.wncTrack||'',true);});
});

document.querySelectorAll('.wnc-mobile-button').forEach(el=>el.addEventListener('click',()=>{playClick();renderWnc(el.dataset.wncAction,el.dataset.wncTrack||'',true);}));

const wncRecordButton=document.getElementById('wncRecordButton');
const wncRecordHint=document.getElementById('wncRecordHint');
wncRecordButton?.addEventListener('click',()=>{
  const coarse=matchMedia('(pointer: coarse)').matches;
  if(coarse && !wncRecordArmed){
    wncRecordArmed=true;wncRecordHint?.classList.add('show');playHover();
    setTimeout(()=>{wncRecordArmed=false;wncRecordHint?.classList.remove('show');},1800);
    return;
  }
  wncRecordArmed=false;wncRecordHint?.classList.remove('show');playClick();
  location.hash='#/signal/wnc/the-space-between-signals';
});


document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{playClick();location.hash=el.dataset.go;}));
document.getElementById('backBtn').addEventListener('click',()=>history.back());
window.addEventListener('hashchange',route);

/* ---------- entrance music + subtle UI sounds ---------- */
let ctx=null, soundOn=false;
function ensureAudioContext(){
  if(ctx) return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
}
function syncEntranceMusic(target){
  if(!entranceMusic) return;
  if(soundOn && target==='entrance'){
    entranceMusic.play().catch(()=>{});
  }else{
    entranceMusic.pause();
  }
}
function setSound(on){
  soundOn=on;
  soundBtn.textContent=on?'SOUND ON':'SOUND OFF';
  if(on){
    ensureAudioContext();
    ctx.resume?.();
    const h=location.hash || '#/entrance';
    syncEntranceMusic(h==='#/entrance' ? 'entrance' : '');
  }else{
    entranceMusic?.pause();
  }
}
soundBtn.addEventListener('click',()=>setSound(!soundOn));
function playHover(){
  if(!soundOn||!ctx) return;
  const dur=.06;
  const b=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const s=ctx.createBufferSource();
  const f=ctx.createBiquadFilter();
  f.type='highpass'; f.frequency.value=900;
  const g=ctx.createGain(); g.gain.value=.018;
  s.buffer=b; s.connect(f).connect(g).connect(ctx.destination); s.start();
}
function playClick(){
  if(!soundOn||!ctx) return;
  const o=ctx.createOscillator();
  o.type='sine';
  o.frequency.setValueAtTime(88,ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(48,ctx.currentTime+.12);
  const g=ctx.createGain();
  g.gain.setValueAtTime(.028,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.14);
  o.connect(g).connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime+.15);
}

/* ---------- SHIJiMA desktop image-coordinate alignment ----------
   The background uses background-size:cover. These overlays are therefore
   positioned from the source-image pixel coordinates, not viewport guesses. */
function alignShijimaDesktop(){
  const scene=document.getElementById('shijima');
  const paper=document.getElementById('paperHotspots');
  const viewer=scene?.querySelector('.viewer');
  if(!scene||!paper||!viewer) return;

  const mobilePortrait=matchMedia('(orientation: portrait) and (max-width:850px)').matches;
  if(mobilePortrait){
    [paper,viewer].forEach(el=>{
      el.style.left=''; el.style.top=''; el.style.width=''; el.style.height='';
    });
    return;
  }

  const W=scene.clientWidth, H=scene.clientHeight;
  const IW=1672, IH=941;
  const scale=Math.max(W/IW,H/IH);
  const drawW=IW*scale, drawH=IH*scale;
  const ox=(W-drawW)/2, oy=(H-drawH)/2;
  const place=(el,x,y,w,h)=>{
    el.style.left=(ox+x*scale)+'px';
    el.style.top=(oy+y*scale)+'px';
    el.style.width=(w*scale)+'px';
    el.style.height=(h*scale)+'px';
  };

  // White paper physical bounds in the 1672x941 source image.
  place(paper,439,183,474,393);
  // Inner dark glass only: excludes the beige/metal frame.
  place(viewer,981,198,434,342);
}
window.addEventListener('resize',alignShijimaDesktop,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(alignShijimaDesktop,80),{passive:true});

if(!location.hash) location.hash='#/entrance';
route();
alignShijimaDesktop();
</script>
